<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>کتابخانه مجازی</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    /* =========================================================
       فونت، متغیرها و تنظیمات پایه
       ========================================================= */

    :root {
      --tg-bg: var(--tg-theme-bg-color, #0b1120);
      --tg-secondary-bg: var(--tg-theme-secondary-bg-color, #111827);
      --tg-text: var(--tg-theme-text-color, #f8fafc);
      --tg-hint: var(--tg-theme-hint-color, #94a3b8);
      --tg-link: var(--tg-theme-link-color, #60a5fa);
      --tg-button: var(--tg-theme-button-color, #2563eb);

      --page-bg-1: #07111f;
      --page-bg-2: #101d35;
      --page-bg-3: #16112d;

      --text-main: #f8fafc;
      --text-soft: rgba(248, 250, 252, 0.84);
      --text-muted: rgba(203, 213, 225, 0.72);

      --glass-bg: rgba(15, 23, 42, 0.56);
      --glass-bg-strong: rgba(15, 23, 42, 0.76);
      --glass-light: rgba(255, 255, 255, 0.09);
      --glass-light-hover: rgba(255, 255, 255, 0.16);

      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-border-soft: rgba(255, 255, 255, 0.09);

      --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.18);
      --shadow-card: 0 18px 45px rgba(0, 0, 0, 0.24);
      --shadow-button: 0 10px 22px rgba(0, 0, 0, 0.22);

      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--page-bg-1);
    }

    body {
      min-height: 100vh;
      color: var(--tg-text);
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;

      background:
        radial-gradient(
          circle at 12% 8%,
          rgba(59, 130, 246, 0.24),
          transparent 31%
        ),
        radial-gradient(
          circle at 88% 12%,
          rgba(168, 85, 247, 0.20),
          transparent 28%
        ),
        radial-gradient(
          circle at 48% 92%,
          rgba(14, 165, 233, 0.15),
          transparent 35%
        ),
        linear-gradient(
          145deg,
          var(--page-bg-1) 0%,
          var(--page-bg-2) 48%,
          var(--page-bg-3) 100%
        );
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(35px);
      z-index: -1;
    }

    body::before {
      width: 260px;
      height: 260px;
      top: 16%;
      right: -120px;
      background: rgba(14, 165, 233, 0.13);
    }

    body::after {
      width: 310px;
      height: 310px;
      bottom: -130px;
      left: -140px;
      background: rgba(139, 92, 246, 0.14);
    }

    /* =========================================================
       ظرف اصلی
       ========================================================= */

    .header,
    #content,
    #buttons,
    .footer,
    .empty {
      width: 100%;
      max-width: 980px;
    }

    /* =========================================================
       هدر
       ========================================================= */

    .header {
      position: relative;
      overflow: hidden;
      text-align: center;
      margin: 4px auto 20px;
      padding: 24px 20px 20px;

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.15),
          rgba(255, 255, 255, 0.045)
        );

      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);

      box-shadow:
        var(--shadow-card),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);

      backdrop-filter: blur(20px) saturate(135%);
      -webkit-backdrop-filter: blur(20px) saturate(135%);
    }

    .header::before {
      content: "";
      position: absolute;
      width: 160px;
      height: 160px;
      top: -95px;
      left: -75px;
      border-radius: 50%;
      background: rgba(96, 165, 250, 0.19);
      filter: blur(12px);
      pointer-events: none;
    }

    .header::after {
      content: "";
      position: absolute;
      width: 130px;
      height: 130px;
      bottom: -85px;
      right: -55px;
      border-radius: 50%;
      background: rgba(192, 132, 252, 0.15);
      filter: blur(14px);
      pointer-events: none;
    }

    .header h1 {
      position: relative;
      z-index: 1;
      color: #ffffff;
      font-size: clamp(1.2rem, 3vw, 1.7rem);
      font-weight: 800;
      line-height: 1.8;
      margin-bottom: 8px;
      word-break: break-word;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.36);
    }

    .crumb {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 4px;

      color: var(--text-muted);
      font-size: 0.84rem;
      line-height: 2;
      word-break: break-word;
    }

    .crumb a {
      color: #93c5fd;
      text-decoration: none;
      cursor: pointer;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 8px;
      transition: background 0.18s ease, color 0.18s ease;
    }

    .crumb a:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
    }

    /* =========================================================
       باکس محتوا
       ========================================================= */

    .content-box {
      position: relative;
      overflow: hidden;
      margin: 0 auto 20px;
      padding: 18px;

      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);

      box-shadow:
        var(--shadow-card),
        inset 0 1px 0 rgba(255, 255, 255, 0.11);

      backdrop-filter: blur(20px) saturate(130%);
      -webkit-backdrop-filter: blur(20px) saturate(130%);
    }

    .content-box::before {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      top: -120px;
      right: -80px;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.12);
      pointer-events: none;
    }

    .content-box h3 {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 8px;

      color: #dbeafe;
      font-size: 0.98rem;
      font-weight: 800;
      margin-bottom: 14px;
      padding-bottom: 13px;

      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .text-item {
      position: relative;
      overflow: hidden;
      margin: 10px 0;
      padding: 14px 15px;

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.105),
          rgba(255, 255, 255, 0.045)
        );

      border: 1px solid var(--glass-border-soft);
      border-radius: var(--radius-md);

      color: var(--text-soft);
      font-size: 0.91rem;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 2;

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 7px 18px rgba(0, 0, 0, 0.10);
    }

    /* =========================================================
       فایل‌ها
       ========================================================= */

    .file-item {
      position: relative;
      overflow: hidden;
      margin: 11px 0;
      padding: 15px;

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.115),
          rgba(255, 255, 255, 0.05)
        );

      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 18px;

      color: var(--text-main);

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.09),
        0 8px 20px rgba(0, 0, 0, 0.12);

      transition:
        transform 0.18s ease,
        background 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .file-item::before {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      top: -90px;
      left: -70px;
      border-radius: 50%;
      background: rgba(96, 165, 250, 0.11);
      pointer-events: none;
    }

    .file-item:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.23);
      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.16),
          rgba(255, 255, 255, 0.065)
        );
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.13),
        0 13px 25px rgba(0, 0, 0, 0.16);
    }

    .file-item.has-file {
      cursor: pointer;
    }

    .file-item.has-file:active {
      transform: scale(0.987);
      filter: brightness(0.96);
    }

    .file-title {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 9px;

      color: #ffffff;
      font-weight: 800;
      line-height: 1.8;
      word-break: break-word;
    }

    .file-name {
      flex: 1;
      min-width: 0;
    }

    .file-open {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;

      padding: 4px 10px;
      border: 1px solid rgba(147, 197, 253, 0.38);
      border-radius: 999px;

      background: rgba(37, 99, 235, 0.28);
      color: #dbeafe;

      font-size: 0.73rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .file-caption {
      position: relative;
      z-index: 1;

      color: var(--text-soft);
      font-size: 0.85rem;
      white-space: pre-wrap;
      margin-top: 8px;
      line-height: 1.85;
      word-break: break-word;
    }

    .file-type {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;

      margin-top: 9px;
      padding: 3px 9px;

      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;

      background: rgba(255, 255, 255, 0.07);
      color: rgba(226, 232, 240, 0.78);

      font-size: 0.71rem;
      font-weight: 600;
    }

    .file-item img,
    .file-item video {
      position: relative;
      z-index: 1;
      margin-top: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14) !important;
      border-radius: 15px !important;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.20);
    }

    .file-item audio {
      position: relative;
      z-index: 1;
      margin-top: 10px;
      filter: invert(0.95) hue-rotate(175deg) saturate(0.8);
      border-radius: 10px;
    }

    /* =========================================================
       دکمه‌های لینک فایل
       این بخش روی دکمه‌هایی که در جاوااسکریپت با inline-style
       ساخته می‌شوند نیز اعمال می‌شود.
       ========================================================= */

    .file-item a {
      position: relative;
      z-index: 1;
      min-height: 43px;
      display: flex !important;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255, 255, 255, 0.18) !important;
      border-radius: 13px !important;

      font-weight: 800;
      line-height: 1.4;

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.16),
        0 7px 14px rgba(0, 0, 0, 0.15);

      transition:
        transform 0.16s ease,
        filter 0.16s ease,
        box-shadow 0.16s ease;
    }

    .file-item a:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        0 10px 19px rgba(0, 0, 0, 0.20);
    }

    .file-item a:active {
      transform: scale(0.98);
      filter: brightness(0.93);
    }

    /* =========================================================
       ردیف دکمه‌های پوشه
       ========================================================= */

    .row {
      display: flex;
      align-items: stretch;
      gap: 12px;
      width: 100%;
      margin: 0 auto 12px;
    }

    .row .btn {
      flex: 1 1 0;
      min-width: 0;
    }

    /* =========================================================
       دکمه‌های اصلی پوشه‌ها
       ========================================================= */

    .btn {
      position: relative;
      isolation: isolate;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 68px;
      padding: 15px 52px;

      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 20px;

      color: #ffffff;
      font-size: clamp(0.86rem, 2.2vw, 1rem);
      font-weight: 800;
      line-height: 1.55;
      text-align: center;
      cursor: pointer;

      text-shadow: 0 2px 7px rgba(0, 0, 0, 0.34);

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.25),
        inset 0 -1px 0 rgba(0, 0, 0, 0.16),
        var(--shadow-button);

      backdrop-filter: blur(14px) saturate(135%);
      -webkit-backdrop-filter: blur(14px) saturate(135%);

      transition:
        transform 0.18s cubic-bezier(.2,.9,.25,1.2),
        filter 0.18s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease;
    }

    .btn::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 140px;
      height: 150px;
      top: -105px;
      right: -35px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.23);
      filter: blur(10px);
      pointer-events: none;
    }

    .btn::after {
      content: "";
      position: absolute;
      inset: 1px;
      z-index: -1;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      pointer-events: none;
    }

    .btn:hover {
      transform: translateY(-3px);
      filter: saturate(1.1) brightness(1.07);
      border-color: rgba(255, 255, 255, 0.34);

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.32),
        inset 0 -1px 0 rgba(0, 0, 0, 0.13),
        0 15px 28px rgba(0, 0, 0, 0.29);
    }

    .btn:active {
      transform: scale(0.977);
      filter: brightness(0.92);
    }

    .btn:focus-visible,
    .footer button:focus-visible,
    .crumb a:focus-visible {
      outline: 3px solid rgba(147, 197, 253, 0.80);
      outline-offset: 3px;
    }

    /*
      اسم پوشه:
      با absolute وسط قرار می‌گیرد تا وجود شمارنده یا فلش
      باعث جابه‌جایی متن اصلی نشود.
    */
    .btn > span:first-child:not(.count):not(.arrow) {
      position: absolute;
      top: 50%;
      left: 15px;
      right: 15px;

      transform: translateY(-50%);

      display: block;
      width: auto;

      text-align: center;
      pointer-events: none;
      word-break: break-word;
    }

    .btn .arrow {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);

      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 28px;
      height: 28px;

      border: 1px solid rgba(255, 255, 255, 0.20);
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.12);
      color: inherit;

      font-size: 1.15rem;
      font-weight: 800;
      opacity: 0.96;
    }

    .btn .count {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);

      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 35px;
      min-height: 28px;
      padding: 4px 9px;

      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;

      background: rgba(0, 0, 0, 0.18);
      color: inherit;

      font-size: 0.73rem;
      font-weight: 800;
      white-space: nowrap;

      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    /* =========================================================
       پالت رنگ دکمه‌ها
       ========================================================= */

    .green {
      background:
        linear-gradient(
          135deg,
          rgba(52, 211, 153, 0.96),
          rgba(5, 150, 105, 0.96)
        ) !important;
    }

    .blue {
      background:
        linear-gradient(
          135deg,
          rgba(96, 165, 250, 0.96),
          rgba(37, 99, 235, 0.96)
        ) !important;
    }

    .red {
      background:
        linear-gradient(
          135deg,
          rgba(251, 113, 133, 0.96),
          rgba(225, 29, 72, 0.96)
        ) !important;
    }

    .orange {
      background:
        linear-gradient(
          135deg,
          rgba(251, 146, 60, 0.96),
          rgba(234, 88, 12, 0.96)
        ) !important;
    }

    .purple {
      background:
        linear-gradient(
          135deg,
          rgba(192, 132, 252, 0.96),
          rgba(126, 34, 206, 0.96)
        ) !important;
    }

    .none {
      background:
        linear-gradient(
          135deg,
          rgba(59, 130, 246, 0.96),
          rgba(30, 64, 175, 0.96)
        ) !important;
    }

    /* =========================================================
       فوتر
       ========================================================= */

    .footer {
      display: flex;
      gap: 12px;
      margin: 10px auto 0;
      padding: 18px 0 8px;
    }

    .footer button {
      position: relative;
      overflow: hidden;

      flex: 1;
      min-height: 52px;
      padding: 12px 16px;

      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.14),
          rgba(255, 255, 255, 0.07)
        );

      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        0 8px 18px rgba(0, 0, 0, 0.16);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      transition:
        transform 0.16s ease,
        background 0.16s ease,
        filter 0.16s ease;
    }

    .footer button::before {
      content: "";
      position: absolute;
      width: 85px;
      height: 85px;
      left: -42px;
      top: -48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.10);
      pointer-events: none;
    }

    .footer button:hover:not(:disabled) {
      transform: translateY(-2px);
      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.20),
          rgba(255, 255, 255, 0.10)
        );
    }

    .footer button:active:not(:disabled) {
      transform: scale(0.98);
      filter: brightness(0.92);
    }

    .footer button:disabled {
      cursor: not-allowed;
      opacity: 0.46 !important;
      filter: grayscale(0.35);
    }

    /* =========================================================
       وضعیت خالی و خطا
       ========================================================= */

    .empty,
    .loading {
      margin: 0 auto;
      padding: 28px 18px;

      border: 1px dashed rgba(255, 255, 255, 0.20);
      border-radius: var(--radius-lg);

      background: rgba(15, 23, 42, 0.42);
      color: var(--text-muted);

      text-align: center;
      font-size: 0.93rem;
      line-height: 1.9;

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    /* =========================================================
       واکنش‌گرایی برای تبلت و دسکتاپ
       ========================================================= */

    @media (min-width: 760px) {
      body {
        padding: 28px;
      }

      .header {
        padding: 30px 30px 25px;
        margin-bottom: 24px;
      }

      .content-box {
        padding: 24px;
      }

      .row {
        gap: 15px;
        margin-bottom: 15px;
      }

      .btn {
        min-height: 78px;
        border-radius: 22px;
      }

      .footer {
        padding-top: 24px;
      }

      .footer button {
        min-height: 58px;
      }
    }

    /* =========================================================
       واکنش‌گرایی برای گوشی‌های کوچک
       ========================================================= */

    @media (max-width: 460px) {
      body {
        padding: 12px;
      }

      .header {
        padding: 20px 14px 17px;
        border-radius: 22px;
      }

      .header h1 {
        font-size: 1.16rem;
      }

      .content-box {
        padding: 13px;
        border-radius: 22px;
      }

      .file-item {
        padding: 13px;
        border-radius: 15px;
      }

      .row {
        gap: 8px;
        margin-bottom: 8px;
      }

      .btn {
        min-height: 62px;
        padding: 12px 42px;
        border-radius: 16px;
        font-size: 0.83rem;
      }

      .btn .count {
        left: 8px;
        min-width: 28px;
        min-height: 24px;
        padding: 3px 6px;
        font-size: 0.66rem;
      }

      .btn .arrow {
        right: 8px;
        width: 24px;
        height: 24px;
        font-size: 0.95rem;
      }

      .footer {
        gap: 8px;
        padding-top: 15px;
      }

      .footer button {
        min-height: 49px;
        padding: 10px 8px;
        border-radius: 14px;
        font-size: 0.83rem;
      }
    }

    /*
      اگر در یک ردیف تعداد زیادی دکمه وجود داشت،
      روی موبایل به‌صورت مرتب زیر هم قرار می‌گیرند.
    */
    @media (max-width: 380px) {
      .row {
        flex-wrap: wrap;
      }

      .row .btn {
        flex: 1 1 100%;
      }
    }

    /*
      کاهش انیمیشن برای کاربرانی که motion reduction فعال دارند.
    */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
    /* =========================================================
       Rich Text داخل محتوای کتابخانه
       ========================================================= */
    
    .text-item b,

    /* =========================================================
       دریافت اطلاعات نود
       ========================================================= */

    async function fetchNode(nodeId) {

      const response = await fetch(
        "/miniapp-data?node=" +
        encodeURIComponent(nodeId),
        {
          cache: "no-store"
        }
      );


      let result;

      try {

        result = await response.json();

      } catch (error) {

        throw new Error(
          "پاسخ سرور نامعتبر است."
        );

      }


      if (!response.ok || result.ok === false) {

        throw new Error(
          result.error ||
          "خطا در دریافت اطلاعات."
        );

      }


      return result.data || result;

    }


    /* =========================================================
       تشخیص رنگ متن برای رنگ‌های دلخواه دکمه
       جلوگیری از مشکل متن سفید روی پس‌زمینه سفید
       ========================================================= */

    function getContrastTextColor(color) {

      if (
        typeof color !== "string" ||
        !color.startsWith("#")
      ) {
        return "#ffffff";
      }

      let hex =
        color.replace("#", "").trim();

      if (hex.length === 3) {

        hex =
          hex
            .split("")
            .map((character) => {
              return character + character;
            })
            .join("");

      }

      if (hex.length !== 6) {
        return "#ffffff";
      }

      const red =
        parseInt(
          hex.substring(0, 2),
          16
        );

      const green =
        parseInt(
          hex.substring(2, 4),
          16
        );

      const blue =
        parseInt(
          hex.substring(4, 6),
          16
        );

      if (
        Number.isNaN(red) ||
        Number.isNaN(green) ||
        Number.isNaN(blue)
      ) {
        return "#ffffff";
      }

      const brightness =
        (
          red * 299 +
          green * 587 +
          blue * 114
        ) / 1000;

      return brightness > 175
        ? "#0f172a"
        : "#ffffff";

    }

    /* =========================================================
       اعمال رنگ دکمه (اصلاح شده برای متن همیشه سیاه)
       ========================================================= */
    
    function applyStyle(element, style) {
      // همیشه متن دکمه‌ها را مشکی تنظیم می‌کنیم
      const forceTextColor = "#000000"; 
      element.style.color = forceTextColor;
    
      if (!style || style === "none") {
        element.classList.add("none");
        return;
      }
    
      if (typeof style === "string" && style.startsWith("#")) {
        element.style.background = `linear-gradient(135deg, ${style}, ${style})`;
        // در اینجا دیگر تابع getContrastTextColor را صدا نمی‌زنیم 
        // و مستقیماً همان رنگ مشکی که بالا تعریف کردیم را اعمال می‌کنیم
        element.style.textShadow = "none"; 
        return;
      }
    
      const safeClass = String(style).replace(/[^a-zA-Z0-9_-]/g, "");
      element.classList.add(safeClass || "none");
    }

    /* =========================================================
       نمایش امن متن فرمت‌دار HTML

       b, strong, i, em, u, s, del, code, pre, br, blockquote,
       tg-spoiler
       ========================================================= */
    
    function formatRichText(value) {
      const template = document.createElement("template");
    
      template.innerHTML = String(value || "");
    
      const allowedTags = new Set([
        "B",
        "STRONG",
        "I",
        "EM",
        "U",
        "S",
        "DEL",
        "CODE",
        "PRE",
        "BR",
        "BLOCKQUOTE",
        "TG-SPOILER"
      ]);
    
      function sanitizeNodes(parent) {
        const nodes = [...parent.childNodes];
    
        nodes.forEach((node) => {
          // متن عادی بدون تغییر باقی می‌ماند
          if (node.nodeType === Node.TEXT_NODE) {
            return;
          }
    
          // اگر کامنت یا نوع ناشناخته باشد حذف می‌شود
          if (node.nodeType !== Node.ELEMENT_NODE) {
            node.remove();
            return;
          }
    
          // اگر تگ غیرمجاز بود، خود تگ حذف می‌شود
          // ولی متن و فرزندانش باقی می‌مانند.
          if (!allowedTags.has(node.tagName)) {
            const fragment = document.createDocumentFragment();
    
            while (node.firstChild) {
              fragment.appendChild(node.firstChild);
            }
    
            node.replaceWith(fragment);
    
            // برای پاک‌سازی تگ‌های داخلی، دوباره بررسی می‌کنیم
            sanitizeNodes(parent);
            return;
          }
    
          // تمام attributeها حذف می‌شوند:
          // onclick، style، href، src و... اجازه ندارند.
          [...node.attributes].forEach((attribute) => {
            node.removeAttribute(attribute.name);
          });
    
          // پاک‌سازی محتوای داخل تگ مجاز
          sanitizeNodes(node);
        });
      }
    
      sanitizeNodes(template.content);
    
      return template.innerHTML;
    }
    
    
    /* برای alt تصویر؛ تگ HTML در alt نباید نمایش داده شود */
    function getPlainText(value) {
      const temp = document.createElement("div");
    
      temp.innerHTML = formatRichText(value);
    
      return temp.textContent || temp.innerText || "";
    }

        const title =
          document.createElement("div");
    
        title.className =
          "file-title";
    
        title.innerHTML =
          "📎 " +
          formatRichText(filename);
    
        itemDiv.appendChild(title);
    
    
        const openButton =
          document.createElement("a");
    
        openButton.href =
          fileUrl;
    
        openButton.target =
          "_blank";
    
        openButton.textContent =
          "📂 باز کردن فایل";
    
        openButton.style.display =
          "block";
    
        openButton.style.marginTop =
          "10px";
    
        openButton.style.padding =
          "10px";
    
        openButton.style.textAlign =
          "center";
    
        openButton.style.borderRadius =
          "8px";
    
        openButton.style.background =
          "var(--tg-theme-button-color, #2481cc)";
    
        openButton.style.color =
          "white";
    
        openButton.style.textDecoration =
          "none";
    
        itemDiv.appendChild(
          openButton
        );
    
    
        box.appendChild(itemDiv);
    
      });
    
    
      contentDiv.appendChild(box);
    }
    
    
    /* =========================================================
       نمایش دکمه‌های پوشه
       ========================================================= */

    function renderButtons(node) {

      const buttonsDiv =
        document.getElementById(
          "buttons"
        );


      buttonsDiv.innerHTML = "";


      const rows =
        Array.isArray(node.rows)
          ? node.rows
          : [];


      rows.forEach(
        (rowChildren) => {

          const row =
            document.createElement(
              "div"
            );


          row.className =
            "row";


          rowChildren.forEach(
            (child) => {

              const button =
                document.createElement(
                  "button"
                );


              button.type =
                "button";


              button.className =
                "btn";


              applyStyle(
                button,
                child.style
              );


              const name =
                document.createElement(
                  "span"
                );


              name.textContent =
                child.name ||
                "بدون نام";


              button.appendChild(
                name
              );


              if (
                child.content_count
              ) {

                const count =
                  document.createElement(
                    "span"
                  );


                count.className =
                  "count";


                count.textContent =
                  `${child.content_count} 📎`;


                button.appendChild(
                  count
                );

              }

              else if (
                child.has_children
              ) {

                const arrow =
                  document.createElement(
                    "span"
                  );


                arrow.className =
                  "arrow";


                arrow.textContent =
                  "▸";


                button.appendChild(
                  arrow
                );

              }


              button.onclick = () => {

                historyStack.push(
                  node.id
                );


                render(
                  child.id
                );

              };


              row.appendChild(
                button
              );

            }
          );


          buttonsDiv.appendChild(
            row
          );

        }
      );


      const empty =
        document.getElementById(
          "empty"
        );


      const hasFolders =
        rows.length > 0;


      const hasContents =
        Array.isArray(node.contents) &&
        node.contents.length > 0;


      empty.textContent =
        "این پوشه خالی است.";


      empty.style.display =
        (
          !hasFolders &&
          !hasContents
        )
          ? "block"
          : "none";

    }


    /* =========================================================
       نمایش نود
       ========================================================= */

    async function render(nodeId) {

      const empty =
        document.getElementById(
          "empty"
        );


      try {

        empty.style.display =
          "none";


        const node =
          await fetchNode(
            nodeId
          );


        if (
          !node ||
          !node.id
        ) {

          throw new Error(
            "داده‌های پوشه معتبر نیستند."
          );

        }


        document.getElementById(
          "title"
        ).textContent =
          node.name ||
          "📚 کتابخانه";


        renderCrumb(node);


        renderContents(
          node.contents
        );


        renderButtons(node);


        updateNavButtons(
          node.id
        );


        window.scrollTo(
          0,
          0
        );

      }

      catch (error) {

        console.error(
          "Miniapp render error:",
          error
        );


        document.getElementById(
          "title"
        ).textContent =
          "📚 کتابخانه";


        document.getElementById(
          "crumb"
        ).innerHTML =
          "";


        document.getElementById(
          "content"
        ).innerHTML =
          "";


        document.getElementById(
          "buttons"
        ).innerHTML =
          "";


        empty.textContent =
          "خطا در دریافت اطلاعات: " +
          error.message;


        empty.style.display =
          "block";


        updateNavButtons(
          "root"
        );

      }

    }


    /* =========================================================
       بازگشت
       ========================================================= */

    function goBack() {

      if (
        historyStack.length > 0
      ) {

        const previousNodeId =
          historyStack.pop();


        render(
          previousNodeId
        );

      }

      else {

        render(
          "root"
        );

      }

    }


    /* =========================================================
       رفتن به یک مسیر
       ========================================================= */

    function goTo(nodeId) {

      const targetId =
        String(nodeId);


      if (
        targetId === "root"
      ) {

        historyStack = [];

      }

      else {

        const idx =
          historyStack.indexOf(
            targetId
          );


        if (idx !== -1) {

          historyStack =
            historyStack.slice(
              0,
              idx
            );

        }

      }


      render(
        targetId
      );

    }


    /* =========================================================
       شروع
       ========================================================= */

    render("root");

  </script>
